<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🎤 Presenter View – TXNG BCT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #263244;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ═══ TOP BAR ═══ */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .topbar-title { font-size: 13px; font-weight: 700; color: var(--accent-light); letter-spacing: 0.5px; }

    /* Slide counter */
    .slide-counter {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 4px 14px;
      min-width: 80px;
      text-align: center;
    }

    /* Timer */
    .timer {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--green);
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 4px 14px;
      cursor: pointer;
      min-width: 90px;
      text-align: center;
    }
    .timer.warn { color: var(--yellow); }
    .timer.danger { color: var(--red); animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }

    .timer-label { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 2px; }

    /* Nav buttons */
    .nav-btns { display: flex; gap: 8px; }
    .nav-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 18px;
      width: 38px; height: 38px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: var(--accent); border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ═══ MAIN BODY ═══ */
    .main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }

    /* ═══ NOTES PANEL ═══ */
    .notes-panel {
      padding: 20px 24px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    .notes-panel::-webkit-scrollbar { width: 6px; }
    .notes-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .slide-title-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .slide-badge {
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .slide-title-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    /* Notes text */
    .notes-content {
      font-size: 15px;
      color: var(--text);
      line-height: 1.85;
    }
    .notes-content p { margin-bottom: 12px; }
    .notes-content strong { color: #fbbf24; font-weight: 700; }
    .notes-content em { color: var(--accent-light); font-style: normal; }
    .notes-content .cue {
      display: inline-block;
      background: #292524;
      color: #fb923c;
      border: 1px solid #78350f;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      margin: 4px 0;
    }
    .notes-content ul { padding-left: 20px; margin-bottom: 12px; }
    .notes-content li { margin-bottom: 6px; }
    .notes-content .sep {
      border: none;
      border-top: 1px dashed var(--border);
      margin: 16px 0;
    }

    /* ═══ RIGHT SIDEBAR ═══ */
    .sidebar {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Progress bar */
    .progress-wrap {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .progress-bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .progress-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: right;
    }

    /* Slide list */
    .slide-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
    }
    .slide-list::-webkit-scrollbar { width: 4px; }
    .slide-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .slide-list-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .slide-list-item:hover { background: var(--surface2); }
    .slide-list-item.current { background: rgba(124,58,237,0.2); border-left: 3px solid var(--accent); padding-left: 8px; }
    .slide-list-item.done { opacity: 0.45; }

    .slide-list-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 20px;
      padding-top: 2px;
    }
    .slide-list-item.current .slide-list-num { color: var(--accent-light); }

    .slide-list-info {}
    .slide-list-main { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.4; }
    .slide-list-item.current .slide-list-main { color: var(--accent-light); }
    .slide-list-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.3; }

    /* ═══ NEXT SLIDE PREVIEW ═══ */
    .next-panel {
      padding: 12px 16px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .next-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 6px; }
    .next-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }

    /* Connection status */
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }
    .status-dot.connected { background: var(--green); }
    .status-text { font-size: 11px; color: var(--text-muted); }

    /* Responsive font size buttons */
    .font-controls { display: flex; gap: 4px; }
    .font-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      width: 28px; height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .font-btn:hover { color: var(--text); border-color: var(--accent); }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">

    <div style="display:flex; align-items:center; gap:6px;">

  </div>

</div>

  <li><strong>Blockchain:</strong> Cũ ❌ không có chống giả mạo. Mới ✅ <strong>Hyperledger Fabric</strong> – mọi sự kiện bất biến.</li>

    {

      sub: '',
      notes: `<p>Kính thưa các anh chị Lãnh đạo,</p>

    },
    {
      title: 'Phụ lục: IoT tự động 100%',
      sub: 'EPCIS 2.0 – không kê khai thủ công',
      notes: `<p>Slide phụ lục về <strong>IoT tự động 100%</strong>. Chỉ dùng khi có câu hỏi chuyên sâu.</p>

    },
    {
      title: 'Phụ lục: Mã định danh quốc tế',
      sub: 'GS1 Digital Link QR – hỗ trợ đa chuẩn',
      notes: `<p>Slide phụ lục về <strong>các loại mã định danh quốc tế GS1</strong>. Chỉ dùng khi có câu hỏi chuyên sâu.</p>

  // ════════════════════════════════════
  //  STATE
  // ════════════════════════════════════
  let currentSlide = 1;
  const totalSlides = SLIDES.length;
  let fontSize = 15;

  // ════════════════════════════════════
  //  BROADCASTCHANNEL
  // ════════════════════════════════════
  const bc = new BroadcastChannel('txng-presenter');

  bc.onmessage = (ev) => {
    if (ev.data.type === 'slide-change') {
      updateSlide(ev.data.slide);
      setConnected(true);
    }
  };

  function sendNav(dir) {
    bc.postMessage({ type: 'nav', dir });
    // Cũng tự cập nhật local nếu chưa nhận phản hồi
    updateSlide(Math.max(1, Math.min(currentSlide + dir, totalSlides)));
  }

  // ════════════════════════════════════
  //  UI UPDATE
  // ════════════════════════════════════
  function updateSlide(n) {
    currentSlide = Math.max(1, Math.min(n, totalSlides));
    const s = SLIDES[currentSlide - 1];

    document.getElementById('slideCounter').textContent = currentSlide + ' / ' + totalSlides;
    document.getElementById('slideBadge').textContent = 'Slide ' + currentSlide;
    document.getElementById('slideHeading').textContent = s.title + (s.sub ? ' – ' + s.sub : '');
    document.getElementById('notesContent').innerHTML = s.notes;
    document.getElementById('notesContent').style.fontSize = fontSize + 'px';

    // Progress
    const pct = Math.round((currentSlide / totalSlides) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = currentSlide + ' / ' + totalSlides + ' trang';

    // Next slide
    if (currentSlide < totalSlides) {
      const next = SLIDES[currentSlide];
      document.getElementById('nextSlideTitle').textContent = (currentSlide + 1) + '. ' + next.title + (next.sub ? ' – ' + next.sub : '');
    } else {
      document.getElementById('nextSlideTitle').textContent = '(Hết bài trình bày)';
    }

    // Buttons
    document.getElementById('prevBtn').disabled = currentSlide === 1;
    document.getElementById('nextBtn').disabled = currentSlide === totalSlides;

    // Slide list highlight
    document.querySelectorAll('.slide-list-item').forEach((el, i) => {
      el.classList.toggle('current', i === currentSlide - 1);
      el.classList.toggle('done', i < currentSlide - 1);
    });
    // Scroll list item into view
    const activeItem = document.querySelectorAll('.slide-list-item')[currentSlide - 1];
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    // Scroll notes to top
    document.querySelector('.notes-panel').scrollTop = 0;
  }

  function setConnected(yes) {
    document.getElementById('statusDot').className = 'status-dot' + (yes ? ' connected' : '');
    document.getElementById('statusText').textContent = yes ? 'Đã kết nối với slide' : 'Đang kết nối...';
  }

  // ════════════════════════════════════
  //  BUILD SLIDE LIST
  // ════════════════════════════════════
  const list = document.getElementById('slideList');
  SLIDES.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'slide-list-item' + (i === 0 ? ' current' : '');
    item.onclick = () => sendNav(i + 1 - currentSlide);
    item.innerHTML = `<span class="slide-list-num">${i + 1}</span>
      <div class="slide-list-info">
        <div class="slide-list-main">${s.title}</div>
        ${s.sub ? `<div class="slide-list-sub">${s.sub}</div>` : ''}
      </div>`;
    list.appendChild(item);
  });

  // ════════════════════════════════════
  //  TIMER
  // ════════════════════════════════════
  let elapsed = 0;
  let timerRunning = false;
  const timerEl = document.getElementById('timer');

  function startTimer() {
    if (!timerRunning) {
      timerRunning = true;
      setInterval(() => {
        elapsed++;
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        timerEl.textContent = m + ':' + s;
        if (elapsed >= 900) timerEl.className = 'timer danger';
        else if (elapsed >= 720) timerEl.className = 'timer warn';
        else timerEl.className = 'timer';
      }, 1000);
    }
  }

  function resetTimer() {
    elapsed = 0;
    timerEl.textContent = '00:00';
    timerEl.className = 'timer';
  }

  // ════════════════════════════════════
  //  FONT SIZE
  // ════════════════════════════════════
  function changeFontSize(delta) {
    fontSize = Math.max(11, Math.min(22, fontSize + delta));
    document.getElementById('notesContent').style.fontSize = fontSize + 'px';
  }

  // ════════════════════════════════════
  //  KEYBOARD
  // ════════════════════════════════════
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') sendNav(1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') sendNav(-1);
  });

  // ════════════════════════════════════
  //  INIT
  // ════════════════════════════════════
  updateSlide(1);
  startTimer();

  // Try ping the slide window
  setTimeout(() => {
    bc.postMessage({ type: 'ping' });
  }, 500);
</script>
